plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'checkstyle'
}

version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = "${rootProject.archives_base_name}-${project.show_minecraft_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "orbital_railgun_enhanced" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java.srcDirs = [
            file('src/main/java'),
            layout.buildDirectory.dir('generated/ported/main-common'),
            layout.buildDirectory.dir('generated/ported/main-version')
        ]
        resources.srcDirs = [file('src/main/resources'), rootProject.file('common/src/main/resources')]
    }
    client {
        java.srcDirs = [
            file('src/client/java'),
            layout.buildDirectory.dir('generated/ported/client-common'),
            layout.buildDirectory.dir('generated/ported/client-version')
        ]
        resources.srcDirs = [rootProject.file('common/src/client/resources')]
    }
    test.java.srcDirs = [rootProject.file('common/src/test/java')]
}

repositories {
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name = 'Ladysnake Mods'; url = 'https://maven.ladysnake.org/releases' }
    maven { name = 'Wispforest'; url = 'https://maven.wispforest.io' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "io.wispforest:owo-lib:${owolib_version}"
    annotationProcessor "io.wispforest:owo-lib:${owolib_version}"
    clientAnnotationProcessor "io.wispforest:owo-lib:${owolib_version}"
    compileOnly "maven.modrinth:YL57xq9U:${iris_version}"
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:-processing']
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', rootProject.mod_version
    filesMatching('fabric.mod.json') { expand version: rootProject.mod_version }
}

test { useJUnitPlatform() }

jar { from rootProject.file('LICENSE') }

// Loom writes the Mojang-mapped 1.20.6 sources into build/generated/ported.
// These mechanical 26.1 renames are applied only to that generated copy.
def portedSourceDirectory = layout.buildDirectory.dir('generated/ported')
def normalizePortedSources = tasks.register('normalizePortedSources') {
    dependsOn(
            ':versions:1.20.6:migrate26MainCommon',
            ':versions:1.20.6:migrate26MainVersion',
            ':versions:1.20.6:migrate26ClientCommon',
            ':versions:1.20.6:migrate26ClientVersion')
    inputs.dir(portedSourceDirectory)
    doLast {
        fileTree(portedSourceDirectory).matching { include '**/*.java' }.each { source ->
            def content = source.getText('UTF-8')
            content = content
                    .replace('ResourceLocation', 'Identifier')
                    .replace('new Identifier(', 'Identifier.fromNamespaceAndPath(')
                    .replace('software.bernie.geckolib', 'com.geckolib')
                    .replace('.impl.v1206', '.impl.v2612')
                    .replace('return "v1206";', 'return "v2612";')
                    .replace('InteractionResultHolder<ItemStack>', 'InteractionResult')
                    .replace('net.minecraft.world.InteractionResultHolder', 'net.minecraft.world.InteractionResult')
                    .replace('UseAnim', 'ItemUseAnimation')
                    .replace('net.minecraft.world.item.ItemUseAnimation', 'net.minecraft.world.item.ItemUseAnimation')
                    .replace('PayloadTypeRegistry.playC2S()', 'PayloadTypeRegistry.serverboundPlay()')
                    .replace('PayloadTypeRegistry.playS2C()', 'PayloadTypeRegistry.clientboundPlay()')
                    .replace('context.player().server', 'context.player().level().getServer()')
                    .replace('.getHolder(STRIKE_DAMAGE)', '.get(STRIKE_DAMAGE.identifier())')
                    .replace('super(world, pos, yaw, gameProfile)', 'super(world, gameProfile)')
                    .replace('.isOnCooldown(activeStack.getItem())', '.isOnCooldown(activeStack)')
                    .replace('BuiltInRegistries.SOUND_EVENT.get(soundId)', 'BuiltInRegistries.SOUND_EVENT.getValue(soundId)')
                    .replace('.registryOrThrow(', '.lookupOrThrow(')
                    .replace('.getMinBuildHeight()', '.getMinY()')
                    .replace('.getHeight()', '.getMaxY()')
                    .replace('source.hasPermission(2)',
                            'source.permissions() != net.minecraft.server.permissions.PermissionSet.NO_PERMISSIONS')
            source.setText(content, 'UTF-8')
        }

        [
            'client-version/io/github/kingironman2011/orbital_railgun_enhanced/client/impl/v1206/ClientVersionAdapterImpl.java',
            'client-version/io/github/kingironman2011/orbital_railgun_enhanced/client/impl/v1206/SoundsHandler.java',
            'client-version/io/github/kingironman2011/orbital_railgun_enhanced/client/impl/v1206/AbstractOrbitalRailgunShader.java',
            'client-version/io/github/kingironman2011/orbital_railgun_enhanced/client/impl/v1206/OrbitalRailgunShader.java',
            'client-version/io/github/kingironman2011/orbital_railgun_enhanced/client/impl/v1206/OrbitalRailgunGuiShader.java',
            'client-version/io/github/kingironman2011/orbital_railgun_enhanced/client/impl/v1206/IrisCompatibilityRenderer.java',
            'client-version/io/github/kingironman2011/orbital_railgun_enhanced/client/impl/v1206/OrbitalRailgunRenderer.java',
            'client-common/io/github/kingironman2011/orbital_railgun_enhanced/client/utils/ModDetector.java'
        ].each { relativePath ->
            file(portedSourceDirectory.get().file(relativePath)).delete()
        }

        [
            'main-version/io/github/kingironman2011/orbital_railgun_enhanced/impl/v1206/OrbitalRailgunItem.java',
            'main-version/io/github/kingironman2011/orbital_railgun_enhanced/impl/v1206/OrbitalRailgunItems.java'
        ].each { relativePath ->
            file(portedSourceDirectory.get().file(relativePath)).delete()
        }
    }
}

tasks.withType(JavaCompile).configureEach { dependsOn(normalizePortedSources) }
